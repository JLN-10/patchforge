[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchforge"
version = "0.1.0"
description = "Autonomous Security Patching & Code Refactoring Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
patchforge = "patchforge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
